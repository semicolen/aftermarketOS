[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debport"
version = "0.1.0"
description = "Experimental Debian root filesystem builder with postmarketOS device metadata import"
requires-python = ">=3.11"

[project.scripts]
debport = "debport.__main__:main"

[tool.setuptools.package-data]
debport = ["profiles/*.json"]

[tool.setuptools.packages.find]
include = ["debport*"]
namespaces = false
